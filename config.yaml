# Set to null to compute automatically from years_back
start_date: null
years_back: 10
interval: "1d"

# Legacy simple visible Markov model parameters.
#
# These parameters belong to the original bull/sideways/bear Markov signal
# validation experiment. They should not be interpreted as final strategy
# parameters. Future market regime, sector regime, stock state, HMM, and
# simulation models should use separate config sections.
state_lookback: 20
bull_threshold_pct: 5.0
bear_threshold_pct: 5.0

# Legacy rolling transition window (number of bars)
training_window: 500

# Legacy signal threshold placeholder. The backtester is not implemented and
# this should not be treated as a production entry parameter.
signal_threshold_pct: 10.0

# Forward return horizons to compute
forward_return_days:
  - 5
  - 10
  - 20

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  results_root: "data/results"
  current_results_dir: "data/results/current"
  legacy_results_dir: "data/results/legacy"
